name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install aiohttp yarl typing-extensions
      - name: Import + config smoke test
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "app/src/main/python")
          import backend
          assert len(backend.SETTINGS["programs"]) >= 1, "programs.json must load"
          print("backend ok:", list(backend.SETTINGS["programs"]))
          EOF

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-configuration-cache
